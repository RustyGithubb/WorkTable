[package]
name = "worktable"
version = "0.2.0"
edition = "2024"
description = "Organisation de travail : tableau de bord, calendrier, mail, messages, notes et fichiers Google"
repository = "https://github.com/RustyGithubb/WorkTable"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.23.1"
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
emojis = "0.9.1"
getrandom = "0.4.3"
html2text = "0.17.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
open = "5.4.4"
rfd = "0.17.2"
raw-window-handle = "0.6"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "2", features = ["json"] }
urlencoding = "2.1.3"
webbrowser = "1.2.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
self-replace = "1.5.0"

[target.'cfg(windows)'.dependencies]
# Bordure de la fenêtre du bandeau de notification, sons, langue de Windows, protection de clé (DPAPI).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Security_Cryptography"] }

[build-dependencies]
# Icône du fichier .exe (Explorateur Windows), à partir de assets/logo.ico.
winresource = "0.1"

[profile.release]
# Exécutable plus petit (symboles de débogage retirés).
strip = true

# Profil de la version distribuée (installeur, `dist`) : optimisations à l'édition de liens.
[profile.dist]
inherits = "release"
lto = "thin"
